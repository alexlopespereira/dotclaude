# tests.yml — roda a suíte bin/tests/ em cada PR.
#
# Billing: o repo é PRIVADO — minutos Linux pagam multiplicador 1×; macOS
# pagava 10× por job. A migração P0 do plano de cota (concluída) portou a
# suíte pra idioms GNU-first com fallback BSD, então o job bin-tests roda em
# ubuntu-latest. NÃO há trigger push na main: o evento pull_request já testa
# o merge ref, então o run pós-merge seria duplicado e pagaria em dobro.
# O bloco concurrency cancela o run anterior quando chega push novo no mesmo
# PR, em vez de pagar os dois até o fim.
# Sem paths: filter de propósito — a suíte valida conteúdo de skills/,
# commands/ e agents/; filtrar por path criaria merges falso-verdes.
#
# A cobertura BSD/macOS segue garantida fora do CI: a suíte roda no laptop
# macOS antes de cada commit (Fase 6 dos ciclos + gate local do Ralph).
#
# Fecha o dod_gap recorrente apontado pelos baselines /reflect: a suíte
# só rodava localmente (Fase 6 dos ciclos), nunca no CI.
name: tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run bin/tests suite
        run: bash bin/tests/run-all.sh

  shellcheck:
    # Lint estático dos scripts de produção. Falha em qualquer finding
    # severity>=warning. Escopo: bin/*.sh, bin/lib/*.sh, hooks/*.sh e os
    # scripts da raiz — NÃO inclui bin/tests/ (pre-mortem #3: ~20 findings
    # legados nas suítes; entram em fatia futura para não bloquear este job).
    # Falsos-positivos são silenciados só com `# shellcheck disable=SCnnnn`
    # inline justificado — sem --exclude global no comando.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck (severity=warning)
        run: |
          shellcheck --severity=warning \
            bin/*.sh bin/lib/*.sh hooks/*.sh \
            vm1.sh vm2.sh vm-morning.sh vm-paste.sh sync.sh
