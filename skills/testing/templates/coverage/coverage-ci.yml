# coverage-ci.yml — required-check de cobertura por ciclo (US-03).
#
# O QUE FAZ
#   Roda a suíte do projeto SOB cobertura e chama coverage-gate.sh --gate, que é
#   a ÚNICA autoridade de bloqueio: diff-cover --fail-under=100 no patch + ratchet
#   (.coverage-baseline.json) + backstop de pragma novo sem justificativa. Job
#   vermelho ⇒ merge barrado quando marcado como required check (ver §REQUIRED).
#
#   PARAMETRIZADO por linguagem: o placeholder __LANG__ é substituído por
#   /coverage-init pela linguagem DETECTADA do projeto (V2-fix: antes o template
#   vinha com `--lang bash` fixo e rodava cobertura de bash num projeto Python).
#   Um único job; o passo de install cobre todas as linguagens via `case`.
#
#   Instalado por /coverage-init em .github/workflows/coverage-ci.yml.
#   O script coverage-gate.sh é VENDORADO por /coverage-init em scripts/ci/
#   (o path interno skills/... do dotclaude não existe no projeto-alvo, P0-2).
#
# REQUIRED-CHECK: coverage-gate (__LANG__)
#   ↑ Este literal É o identificador do required check (== `name:` do job abaixo,
#   após a substituição de __LANG__). ANTES de marcar required, valide a fonte:
#       grep -E 'name: coverage-gate \(' .github/workflows/coverage-ci.yml
#   Marcar um check-fantasma (nome que nunca roda) trava merges PARA SEMPRE.
#   Marcar como required (uma vez, após o 1º run verde):
#       gh api -X PUT "repos/{owner}/{repo}/branches/main/protection/required_status_checks" \
#         -F 'strict=true' -f 'checks[][context]=coverage-gate (__LANG__)'
#   ↑ strict é BOOLEAN: use -F/--field (conversão tipada → JSON true). Com -f
#     (raw-field) viraria a string "true" e a API rejeita/ignora silenciosamente.
#     O context é string ⇒ -f. (gh: `-F` magic-types true/false/number/null.)
#
# REVERT (path executável — AC6)
#   Remover SÓ este check dos required:
#       gh api -X DELETE "repos/{owner}/{repo}/branches/main/protection/required_status_checks/contexts" \
#         -f 'contexts[]=coverage-gate (__LANG__)'
#   Remover a branch protection rule inteira da main (revert total):
#       gh api -X DELETE "repos/{owner}/{repo}/branches/main/protection"
#   Dry-run (não toca a API; confirma que a forma do comando é válida):
#       gh api --help
#
# VIOLATION-TEST (prova de que é required de verdade — AC4)
#   Num branch de teste, adicione uma linha nova em código instrumentado SEM teste
#   que a exercite e abra o PR → o job fica vermelho (diff-cover --fail-under=100
#   reprova o patch <100%) e, com o check required, o merge fica bloqueado. Não há
#   `continue-on-error` no passo do gate — senão viraria advisory e a violação
#   passaria silenciosa.
#
# [SUPOSIÇÃO] bash-no-CI (AC7) — RESULTADO REGISTRADO
#   Para --lang bash, coverage-gate.sh usa bashcov (gem Ruby; LINE-only, branch=n/a)
#   e cai em kcov só como fallback. Em ubuntu-latest ambos instalam; kcov é frágil
#   em macOS — por isso a cobertura roda AQUI, em ubuntu-latest, não no runner macOS.
#   Se a instalação falhar, o gate degrada para bashcov line-only — nunca 0% falso.

name: coverage-gate

on:
  pull_request:        # patch-coverage é PR-scoped; um push-to-main daria diff
                       # vazio vs origin/main → diff-cover passa vacuamente (P1-6).

permissions:
  contents: read

jobs:
  coverage-gate:
    name: coverage-gate (__LANG__)
    runs-on: ubuntu-latest          # AC3: NÃO macOS — bashcov/kcov estáveis aqui
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0            # diff-cover precisa do histórico p/ comparar com a base
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
      # Toolchain PINADA por linguagem — default upstream não muda o gate (AC2).
      # npm usa --ignore-scripts (P13b); gem pina via -v (forma nome:versao inválida).
      - name: Instalar tooling de cobertura (pinado, por linguagem)
        run: |
          pip install 'diff-cover==9.2.4'
          case "__LANG__" in
            python)
              pip install 'coverage==7.6.10'
              ;;
            js|ts|liquid)
              npm install -g c8@10.1.3 --ignore-scripts
              ;;
            bash)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends ruby kcov
              gem install --no-document simplecov -v 0.22.0
              gem install --no-document simplecov-lcov -v 0.8.0
              gem install --no-document bashcov -v 3.1.2
              ;;
          esac
      # ÚNICA autoridade de bloqueio. Sem continue-on-error ⇒ job vermelho barra o merge.
      # Script VENDORADO por /coverage-init em scripts/ci/ (P0-2).
      - name: coverage-gate --gate (__LANG__)
        run: |
          chmod +x scripts/ci/coverage-gate.sh
          scripts/ci/coverage-gate.sh --gate --lang __LANG__ --base origin/main
